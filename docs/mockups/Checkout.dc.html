<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B2FD1}a:hover{color:#4421A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5FA; font-family: 'Geist', system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 12px 16px; display: flex; align-items: center; gap: 8px">
    <a href="Cart.dc.html" aria-label="Back to cart" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #18181B">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Checkout</h1>
    <span style="margin-left: auto; font-size: 13px; color: #52525B">Step 1 of 2</span>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 14px; font-weight: 500">Full name</label>
      <input id="name" value="Hodan Ali" style="height: 48px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; color: #18181B">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="phone" style="font-size: 14px; font-weight: 500">Mobile money number</label>
      <div style="display: flex; align-items: center; height: 48px; border: 2px solid #5B2FD1; border-radius: 12px; background: #FFFFFF; overflow: hidden">
        <span style="padding: 0 12px; height: 100%; display: flex; align-items: center; font-size: 16px; color: #52525B; border-right: 1px solid #E4E4E7">+252</span>
        <input id="phone" inputmode="numeric" aria-describedby="phone-hint" value="61 234 5678" style="flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 12px; font: inherit; font-size: 16px">
      </div>
      <span id="phone-hint" style="font-size: 13px; color: #52525B">We detected <strong style="color: #3B1E8F">{{detected}}</strong> from your number. Change it below if needed.</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 500; margin-bottom: 8px; padding: 0">Pay with</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{wallets}}" as="w" hint-placeholder-count="4">
          <button type="button" onClick="{{w.pick}}" aria-pressed="{{w.selected}}" style="{{w.style}}">
            <span style="width: 32px; height: 32px; border-radius: 8px; background: #F4F4F5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3F3F46">{{w.short}}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
              <span style="font-size: 15px; font-weight: 600">{{w.name}}</span>
              <span style="font-size: 12px; color: #52525B">{{w.hint}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </fieldset>

    <section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #52525B"><span>2 items</span><span style="font-variant-numeric: tabular-nums">$18.00</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700"><span>Total</span><span style="font-variant-numeric: tabular-nums">$18.00</span></div>
    </section>
  </main>

  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4E4E7; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{manual}}" hint-placeholder-val="{{ true }}">
      <a href="ManualPay.dc.html" style="height: 52px; border-radius: 14px; background: #5B2FD1; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Continue to payment</a>
    </sc-if>
    <sc-if value="{{auto}}" hint-placeholder-val="{{ false }}">
      <a href="WaitingPin.dc.html" style="height: 52px; border-radius: 14px; background: #5B2FD1; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Pay $18.00 with {{detected}}</a>
    </sc-if>
    <span style="text-align: center; font-size: 12px; color: #52525B">Secure checkout · your PIN is never shared with the store</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["manual","auto"],"default":"manual"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'evc' };
  }
  renderVals() {
    const mode = this.props.mode ?? 'manual';
    const list = [
      { id: 'evc', short: 'EVC', name: 'EVC Plus', hint: 'Hormuud' },
      { id: 'zaad', short: 'ZD', name: 'Zaad', hint: 'Telesom' },
      { id: 'sahal', short: 'SH', name: 'Sahal', hint: 'Golis' },
      { id: 'edahab', short: 'eD', name: 'eDahab', hint: 'Somtel' }
    ];
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font: inherit; color: #18181B; text-align: left; cursor: pointer; ';
    const wallets = list.map((w) => {
      const selected = this.state.picked === w.id;
      return {
        ...w,
        selected: selected ? 'true' : 'false',
        style: base + (selected ? 'border: 2px solid #5B2FD1; box-shadow: 0 0 0 3px #EDE7FC;' : 'border: 1px solid #D4D4D8;'),
        pick: () => this.setState({ picked: w.id })
      };
    });
    const detected = list.find((w) => w.id === this.state.picked).name;
    return { wallets, detected, manual: mode === 'manual', auto: mode === 'auto' };
  }
}
</script>
</body>
</html>
