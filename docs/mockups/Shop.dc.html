<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B2FD1}a:hover{color:#4421A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5FA; font-family: 'Geist', system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #5B2FD1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">D</div>
        <span style="font-size: 18px; font-weight: 700">[Store name]</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <button type="button" aria-label="Change language" style="height: 44px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #18181B">EN</button>
        <a href="Cart.dc.html" aria-label="Cart, 2 items" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E4E7; display: flex; align-items: center; justify-content: center; color: #18181B">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"></path></svg>
          <span style="position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 999px; background: #5B2FD1; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
        </a>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: #F4F4F5; color: #52525B">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search products</span>
      <input placeholder="Search products" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font: inherit; font-size: 16px">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #18181B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap">All</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #18181B; font: inherit; font-size: 14px; white-space: nowrap">Food</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #18181B; font: inherit; font-size: 14px; white-space: nowrap">Beauty</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #18181B; font: inherit; font-size: 14px; white-space: nowrap">Electronics</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 128px; background: #EDE7FC; display: flex; align-items: center; justify-content: center; color: #6D5BA8; font-size: 12px">Product photo</div>
        <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0; font-size: 14px; font-weight: 600; line-height: 18px">{{p.name}}</h3>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{p.price}}</span>
            <button type="button" aria-label="Add to cart" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #5B2FD1; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </article>
    </sc-for>
  </main>

  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4E4E7">
    <a href="Cart.dc.html" style="height: 52px; border-radius: 14px; background: #5B2FD1; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 16px; font-weight: 600">
      <span>2 items · View cart</span>
      <span style="font-variant-numeric: tabular-nums">$18.00</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      products: [
        { name: 'Somali tea blend, 500g', price: '$6.00' },
        { name: 'Uunsi incense, 250g', price: '$12.00' },
        { name: 'Phone charger, USB‑C', price: '$9.50' },
        { name: 'Dates, 1kg box', price: '$8.00' }
      ]
    };
  }
}
</script>
</body>
</html>
