  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 12px 16px; display: flex; align-items: center; gap: 8px">

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">

      </div>
      <a href="tel:*712*61XXXXXXX*18%23" style="margin-top: 6px; width: 100%; height: 48px; border-radius: 12px; border: 2px solid #5B2FD1; color: #5B2FD1; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">

      <span style="font-size: 12px; color: #52525B">Opens your phone dialler with the amount filled in</span>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">After you pay</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="txn" style="font-size: 14px; font-weight: 500">Transaction ID from your SMS</label>
        <input id="txn" placeholder="e.g. 12345678" style="height: 48px; border: 1px solid #D4D4D8; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px">

        <input type="file" accept="image/*" style="position: absolute; width: 1px; height: 1px; opacity: 0">
      </label>
