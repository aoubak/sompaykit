<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B2FD1}a:hover{color:#4421A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5FA; font-family: 'Geist', system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 12px 16px; display: flex; align-items: center; gap: 8px">
    <a href="Shop.dc.html" aria-label="Back to shop" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #18181B">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Your cart</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
      <article style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center">
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 10px; background: #EDE7FC; display: flex; align-items: center; justify-content: center; color: #6D5BA8; font-size: 11px">Photo</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 20px">{{it.name}}</h2>
            <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{it.price}}</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div style="display: flex; align-items: center; border: 1px solid #E4E4E7; border-radius: 12px">
              <button type="button" aria-label="Decrease quantity" style="width: 44px; height: 40px; border: 0; background: transparent; font: inherit; font-size: 20px; color: #18181B">−</button>
              <span style="min-width: 24px; text-align: center; font-size: 15px; font-weight: 600">1</span>
              <button type="button" aria-label="Increase quantity" style="width: 44px; height: 40px; border: 0; background: transparent; font: inherit; font-size: 20px; color: #18181B">+</button>
            </div>
            <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #B91C1C">Remove</button>
          </div>
        </div>
      </article>
    </sc-for>

    <section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 15px; color: #52525B"><span>Subtotal</span><span style="font-variant-numeric: tabular-nums">$18.00</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 15px; color: #52525B"><span>Delivery</span><span>Arranged on WhatsApp</span></div>
      <div style="height: 1px; background: #E4E4E7"></div>
      <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700"><span>Total</span><span style="font-variant-numeric: tabular-nums">$18.00</span></div>
    </section>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #EDE7FC; color: #3B1E8F; font-size: 14px; line-height: 20px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
      <span>Pay with EVC Plus, Zaad, Sahal or eDahab. No card needed.</span>
    </div>
  </main>

  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4E4E7">
    <a href="Checkout.dc.html" style="height: 52px; border-radius: 14px; background: #5B2FD1; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Checkout · $18.00</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Somali tea blend, 500g', price: '$6.00' },
        { name: 'Uunsi incense, 250g', price: '$12.00' }
      ]
    };
  }
}
</script>
</body>
</html>
